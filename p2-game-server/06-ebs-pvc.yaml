apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ebs-pvc-1
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ebs-sc
  resources:
    requests:
      storage: 20Gi
