# server-1 Deployment and Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft-server-1
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minecraft-server-1
  template:
    metadata:
      labels:
        app: minecraft-server-1
    spec:
      containers:
      - name: minecraft-server-1
        image: itzg/minecraft-server
        env:
        - name: EULA
          value: "TRUE"
        - name: ENABLE_LOGGING
          value: "true"
        - name: ONLINE_MODE
          value: "false"
        ports:
        - containerPort: 25565
        volumeMounts:
        - name: minecraft-data
          mountPath: /data
        - name: efs-sc
          mountPath: /data/logs  # Minecraft 서버 로그 파일이 저장되는 디렉토리
      volumes:
      - name: minecraft-data
        persistentVolumeClaim:
          claimName: ebs-pvc-1
      - name: efs-sc
        persistentVolumeClaim:
          claimName: efs-claim  # PVC를 통해 EFS 볼륨 사용
---
apiVersion: v1
kind: Service
metadata:
  name: minecraft-service-1
  namespace: default
spec:
  type: NodePort
  ports:
  - port: 25565
    targetPort: 25565
    nodePort: 30001
  selector:
    app: minecraft-server-1
