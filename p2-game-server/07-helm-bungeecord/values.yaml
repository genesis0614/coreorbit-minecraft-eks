namespace: default
replicas: 2
serviceAccount:
  create: false
  name: ""
  automount: true
  annotations: {}
ingress:
  enabled: false
  hosts: []
  tls: []
image:
  repository: itzg/bungeecord
  tag: latest
service:
  type: LoadBalancer
  port: 25577
  targetPort: 25577
  nodePort: 30005
config: |
  server_connect_timeout: 5000
  enforce_secure_profile: false
  remote_ping_cache: -1
  forge_support: false
  player_limit: -1
  permissions:
    default:
    - bungeecord.command.server
    - bungeecord.command.list
    admin:
    - bungeecord.command.alert
    - bungeecord.command.end
    - bungeecord.command.ip
    - bungeecord.command.reload
    - bungeecord.command.kick
    - bungeecord.command.send
    - bungeecord.command.find
  timeout: 30000
  log_commands: false
  network_compression_threshold: 256
  online_mode: false
  disabled_commands:
  - disabledcommandhere
  servers:
    lobby:
      motd: 'Game server1'
      address: minecraft-service-1:25565
      restricted: false
    game:
      motd: 'Game server2'
      address: minecraft-service-2:25565
      restricted: false
  listeners:
  - query_port: 25577
    motd: '&1Another Bungee server'
    tab_list: GLOBAL_PING
    query_enabled: false
    proxy_protocol: false
    forced_hosts:
      pvp.md-5.net: lobby
    ping_passthrough: false
    priorities:
    - lobby
    bind_local_address: true
    host: 0.0.0.0:25577
    max_players: 10
    tab_size: 60
    force_default_server: false
  ip_forward: false
  remote_ping_timeout: 5000
  reject_transfers: false
  prevent_proxy_connections: false
  groups:
    md_5:
    - admin
  connection_throttle: 4000
  stats: 5d0e71f5-6962-491a-ad9c-f28bed714083
  connection_throttle_limit: 3
  log_pings: true