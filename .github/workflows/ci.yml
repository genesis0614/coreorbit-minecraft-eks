name: Basic CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.2

      - name: Validate Terraform (p1)
        working-directory: p1-infra-base/infra
        run: |
          terraform init -backend=false -lockfile=readonly -input=false
          terraform validate

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.1
        with:
          version: v3.16.3

      - name: Check BungeeCord chart (p2)
        run: helm lint p2-game-server/07-helm-bungeecord

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML parser
        run: python -m pip install PyYAML==6.0.3

      - name: Check YAML syntax (p2 and p3)
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          files = sorted(Path("p2-game-server").glob("*.yaml"))
          files += sorted(Path("p3-log-analysis-ELK").rglob("*.yaml"))
          for path in files:
              with path.open(encoding="utf-8") as file:
                  list(yaml.safe_load_all(file))
              print(f"OK: {path}")
          PY